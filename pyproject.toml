[project]
name = "translation-lab"
version = "0.3.0"
description = "Utilities from LLM dataset translation experiments."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ReinforcedKnowledge", email = "reinforced.knowledge@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "langid>=1.1.6",
    "openai>=3.3.1",
]

[project.scripts]
translation-lab = "translation_lab.cli:main"

[project.optional-dependencies]
comet = [
    "unbabel-comet==2.2.7",
]
models = [
    "sentencepiece>=0.2.1",
    "transformers==5.6.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "prek>=0.4.14",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.uv]
conflicts = [[{ extra = "comet" }, { extra = "models" }]]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyrefly]
project-includes = ["src", "tests"]
python-version = "3.14"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
